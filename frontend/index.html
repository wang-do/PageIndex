<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>法规问答</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; overflow: hidden; background: #fff; color: #202123; }
    button { border: 0; border-radius: 6px; cursor: pointer; font: inherit; }
    .app { height: 100vh; overflow: hidden; }
    .sidebar { position: fixed; inset: 0 auto 0 0; width: 252px; padding: 18px 12px; overflow-y: auto; background: #f7f7f8; border-right: 1px solid #e8e8e8; }
    .brand { display: flex; align-items: center; gap: 8px; padding: 5px 10px 24px; font-size: 17px; font-weight: 650; }
    .brand-mark { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; background: #202123; color: #fff; font-size: 12px; }
    #new-session { width: 100%; padding: 10px 12px; text-align: left; background: #fff; border: 1px solid #dedede; color: #343541; box-shadow: 0 1px 2px #00000008; }
    #new-session:hover { background: #f0f0f0; }
    #kb-entry { width: 100%; margin-top: 8px; padding: 10px 12px; text-align: left; background: #fff; border: 1px solid #dedede; color: #343541; box-shadow: 0 1px 2px #00000008; }
    #kb-entry:hover { background: #f0f0f0; }
    .section-label { margin: 25px 10px 8px; color: #8a8a8a; font-size: 12px; }
    #session-list { display: flex; flex-direction: column; gap: 2px; }
    .session-row { display: flex; align-items: center; border-radius: 6px; }
    .session-row.active { background: #e9e9ea; }
    .session-open { min-width: 0; flex: 1; overflow: hidden; padding: 9px 8px 9px 10px; background: transparent; color: #555; text-align: left; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .session-row.active .session-open { color: #222; }
    .main { height: 100vh; min-width: 0; margin-left: 252px; display: flex; flex-direction: column; }
    header { height: 60px; padding: 0 24px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; }
    h1 { margin: 0; font-size: 15px; font-weight: 600; }
    .conversation { width: min(820px, 100%); flex: 1; margin: 0 auto; padding: 32px 24px 150px; overflow-y: auto; }
    #messages { display: flex; flex-direction: column; gap: 26px; }
    .empty { min-height: 52vh; display: grid; place-items: center; color: #8e8e8e; font-size: 14px; }
    .message { max-width: 86%; white-space: pre-wrap; line-height: 1.65; font-size: 15px; }
    .assistant { white-space: normal; }
    .assistant p { margin: 0 0 10px; }
    .assistant p:last-child { margin-bottom: 0; }
    .assistant ul, .assistant ol { margin: 0 0 10px; padding-left: 22px; }
    .assistant .answer-paragraphs { margin: 0; padding-left: 26px; }
    .assistant .answer-paragraphs > li { margin-bottom: 14px; padding-left: 3px; }
    .assistant .answer-paragraphs > li:last-child { margin-bottom: 0; }
    .assistant h1, .assistant h2, .assistant h3 { margin: 14px 0 8px; font-size: 15px; }
    .assistant table { border-collapse: collapse; margin: 0 0 10px; }
    .assistant th, .assistant td { border: 1px solid #e0e0e0; padding: 5px 10px; }
    .assistant code { padding: 1px 5px; border-radius: 4px; background: #f3f3f3; font-size: 13px; }
    .assistant pre { margin: 0 0 10px; padding: 10px 12px; border-radius: 8px; background: #f6f6f6; overflow-x: auto; }
    .assistant pre code { padding: 0; background: transparent; }
    .assistant blockquote { margin: 0 0 10px; padding: 2px 12px; border-left: 3px solid #e0e0e0; color: #666; }
    .meta { margin-top: 8px; font-size: 14px; color: #b8b8b8; }
    .steps { margin: 0 0 10px; padding: 6px 10px 6px 12px; border-left: 3px solid #e5e5e5; background: #fafafa; border-radius: 6px; font-size: 12px; color: #8a8a8a; }
    .steps summary { cursor: pointer; }
    .steps li { margin: 3px 0 3px 6px; }
    .user { align-self: flex-end; padding: 11px 15px; border-radius: 18px; background: #f1f1f1; }
    .assistant { align-self: flex-start; color: #202123; }
    .error { align-self: flex-start; color: #a22d2d; }
    .waiting { display: flex; align-items: center; gap: 9px; color: #777; font-size: 13px; }
    .spinner { width: 14px; height: 14px; border: 2px solid #ddd; border-top-color: #555; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .composer-wrap { position: fixed; right: var(--ref-w); bottom: 0; left: 252px; padding: 20px 24px 24px; background: linear-gradient(#fff0, #fff 30%); }
    form { width: min(820px, 100%); margin: 0 auto; display: flex; align-items: flex-end; gap: 10px; padding: 10px 10px 10px 16px; border: 1px solid #d9d9d9; border-radius: 14px; background: #fff; box-shadow: 0 4px 22px #0000000d; }
    textarea { min-height: 28px; max-height: 180px; flex: 1; resize: vertical; padding: 5px 0; border: 0; outline: none; font: inherit; line-height: 1.45; }
    textarea::placeholder { color: #999; }
    #send { width: 32px; height: 32px; padding: 0; border-radius: 50%; background: #202123; color: #fff; font-size: 16px; line-height: 1; }
    #send:disabled, textarea:disabled { opacity: .5; cursor: not-allowed; }
    .hint { width: min(820px, 100%); margin: 8px auto 0; color: #999; text-align: center; font-size: 11px; }
    .context-menu { position: fixed; z-index: 10; width: 156px; padding: 5px; border: 1px solid #dedede; border-radius: 8px; background: #fff; box-shadow: 0 8px 24px #00000024; }
    .context-menu[hidden], .dialog-backdrop[hidden] { display: none; }
    .menu-item { display: flex; width: 100%; align-items: center; gap: 9px; padding: 8px 9px; border-radius: 5px; background: transparent; color: #333; text-align: left; font-size: 13px; }
    .menu-item:hover { background: #f1f1f1; }
    .menu-item.danger { color: #bc3030; }
    .menu-icon { width: 16px; text-align: center; }
    .dialog-backdrop { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; padding: 20px; background: #00000033; }
    .dialog { width: min(430px, 100%); padding: 24px; border-radius: 14px; background: #fff; box-shadow: 0 16px 50px #0000002e; }
    .dialog-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .dialog-title { margin: 0; font-size: 20px; font-weight: 650; }
    .dialog-close { width: 30px; height: 30px; padding: 0; background: transparent; color: #666; font-size: 20px; line-height: 1; }
    .dialog-copy { margin: 6px 0 16px; color: #8b8b8b; font-size: 14px; }
    #rename-input { width: 100%; padding: 9px 10px; border: 1px solid #4a90e2; border-radius: 6px; outline: 0; font: inherit; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
    .dialog-actions button { padding: 8px 15px; background: #f3f3f3; color: #333; }
    .dialog-actions #dialog-confirm { background: #202123; color: #fff; }
    .dialog-actions #dialog-confirm.danger { background: #bb2f2f; }
    /* 右侧原文面板：打开时通过 body.ref-open 的 --ref-w 把聊天区和输入框向左收窄 */
    :root { --ref-w: 0px; }
    body.ref-open { --ref-w: clamp(400px, 44vw, 780px); }
    .main { margin-right: var(--ref-w); transition: margin-right .2s ease; }
    .composer-wrap { transition: right .2s ease; }
    .reference-panel { position: fixed; z-index: 15; top: 0; right: 0; bottom: 0; width: var(--ref-w); display: flex; flex-direction: column; overflow: hidden; background: #222; border-left: 1px solid #e0e0e0; box-shadow: -6px 0 24px #00000022; }
    .reference-panel[hidden] { display: none; }
    .reference-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; background: #333; color: #fff; font-size: 13px; flex: none; }
    .reference-toolbar button { padding: 4px 10px; background: #555; color: #fff; }
    #reference-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reference-content { flex: 1; overflow: hidden; }
    .reference-content { display: flex; align-items: flex-start; justify-content: center; overflow: auto; }
    .reference-content img { display: block; width: 100%; height: auto; border: 0; background: #fff; }
    .reference-toolbar a { color: #fff; font-size: 12px; text-decoration: underline; margin-right: 10px; white-space: nowrap; }
    @media (max-width: 1100px) { body.ref-open { --ref-w: 0px; } .reference-panel { width: min(94vw, 640px); } }
    @media (max-width: 700px) { .sidebar { width: 62px; padding: 18px 8px; } .brand { justify-content: center; padding: 5px 0 24px; } .brand span, .section-label, #session-list, #new-session { display: none; } .main { margin-left: 62px; } .composer-wrap { left: 62px; padding: 14px 12px 18px; } header { padding: 0 16px; } .conversation { padding: 24px 16px 130px; } .message { max-width: 94%; } .hint { display: none; } }
    .para-cites { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-left: 8px; font-size: 12px; color: #4a5568; }
    .refs { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; font-size: 12px; color: #4a5568; }
    .cite-chip { display: inline-block; padding: 2px 9px; color: #1a66cc; background: #eef4ff; border: 1px solid #c9ddf5; border-radius: 10px; cursor: pointer; }
    .cite-chip:hover { background: #dbe9fb; text-decoration: none; }
    .cite-label { color: #4a5568; background: #f2f2f2; border-color: #e0e0e0; cursor: default; }
    .para-cites a { color: #1a66cc; text-decoration: none; cursor: pointer; }
    .para-cites a:hover { text-decoration: underline; }
    .kb-view { position: fixed; inset: 0 0 0 252px; z-index: 30; background: #f7f7f7; display: flex; flex-direction: column; }
    .kb-view[hidden] { display: none; }
    .kb-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: #fff; border-bottom: 1px solid #d9d9d9; }
    .kb-list-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .kb-title { font-size: 16px; font-weight: 600; }
    .kb-list-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; align-content: start; }
    .kb-card { background: #fff; border: 1px solid #d9d9d9; border-radius: 10px; padding: 14px 16px; cursor: pointer; }
    .kb-card:hover { border-color: #1a66cc; box-shadow: 0 2px 10px rgba(26,102,204,.12); }
    .kb-card-name { font-weight: 600; margin-bottom: 4px; }
    .kb-card-sub { color: #1a66cc; font-size: 13px; margin-bottom: 6px; }
    .kb-card-meta { color: #888; font-size: 12px; }
    .kb-detail-view { position: absolute; inset: 0; background: #f7f7f7; display: flex; flex-direction: column; z-index: 2; }
    .kb-detail-view[hidden] { display: none; }
    .kb-detail-toolbar { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: #fff; border-bottom: 1px solid #d9d9d9; font-weight: 600; }
    .kb-detail-body { flex: 1; display: flex; overflow: hidden; }
    .kb-detail-info { width: 300px; flex: none; overflow-y: auto; padding: 18px; background: #fff; border-right: 1px solid #e5e5e5; }
    .kb-info-row { margin-bottom: 10px; font-size: 13px; }
    .kb-info-row span { display: block; color: #999; font-size: 11px; margin-bottom: 2px; }
    .kb-info-desc { margin-top: 14px; font-size: 13px; line-height: 1.7; color: #444; }
    .kb-detail-preview-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .kb-pager { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px; background: #fff; border-bottom: 1px solid #eee; font-size: 13px; }
    .kb-pager button { padding: 2px 12px; font-size: 12px; }
    .kb-pager button:disabled { opacity: 0.4; cursor: not-allowed; }
    .kb-detail-preview { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 16px; }
    .kb-detail-preview img { max-width: 100%; height: auto; box-shadow: 0 2px 14px rgba(0,0,0,.15); }
    .kb-tools { display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: #fff; border-bottom: 1px solid #eee; }
    .kb-select-all { display: flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    #kb-search { flex: 0 1 260px; padding: 6px 10px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 13px; }
    .kb-selected-count { color: #888; font-size: 12px; white-space: nowrap; }
    .kb-card { display: flex; align-items: flex-start; gap: 10px; }
    .kb-card input[type="checkbox"] { margin-top: 3px; cursor: pointer; }
    .kb-card-body { flex: 1; }
    .seg-block { margin-bottom: 10px; }
    .kb-status { padding: 30px; text-align: center; color: #888; }
    .kb-cate-btn { padding: 6px 12px; font-size: 13px; background: #fff; border: 1px solid #d9d9d9; border-radius: 8px; cursor: pointer; }
    .kb-cate-btn:hover { border-color: #1a66cc; color: #1a66cc; }
    .kb-cate-modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 60; display: flex; align-items: center; justify-content: center; }
    .kb-cate-modal[hidden] { display: none; }
    .kb-cate-card { width: 560px; max-width: 92%; max-height: 80vh; overflow-y: auto; background: #fff; border-radius: 14px; padding: 22px 24px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
    .kb-cate-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .kb-cate-group { margin-bottom: 16px; }
    .kb-cate-group-name { font-size: 13px; color: #888; margin-bottom: 8px; }
    .kb-cate-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .kb-cate-chip { padding: 6px 14px; border: 1px solid #d9d9d9; border-radius: 16px; font-size: 13px; cursor: pointer; user-select: none; background: #fff; }
    .kb-cate-chip.on { background: #1a66cc; border-color: #1a66cc; color: #fff; }
    .kb-cate-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .kb-cate-actions button { padding: 7px 18px; border-radius: 8px; border: 1px solid #d9d9d9; background: #fff; cursor: pointer; }
    .kb-cate-actions button.primary { background: #1a66cc; border-color: #1a66cc; color: #fff; }
    .kb-cate-card { transition: border-color .2s; }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">法</div><span>法规问答</span></div>
      <button id="new-session" type="button">＋&nbsp; 新建会话</button>
<button id="kb-entry" type="button">📚&nbsp; 知识库</button>
      <div class="section-label">会话</div>
      <div id="session-list"></div>
    </aside>
    <section class="main">
      <header><h1 id="conversation-title">法规问答</h1></header>
      <div class="conversation"><section id="messages" aria-live="polite"><div class="empty">输入问题开始对话</div></section></div>
      <div class="composer-wrap">
        <form id="chat-form">
          <textarea id="question" placeholder="发送消息" aria-label="问题"></textarea>
          <button id="send" type="submit" aria-label="发送">↑</button>
        </form>
        <div class="hint">Enter 发送，Shift + Enter 换行</div>
      </div>
    </section>
  </main>
  <div id="session-menu" class="context-menu" hidden>
    <button id="menu-rename" class="menu-item" type="button"><span class="menu-icon">✎</span>重命名</button>
    <button id="menu-delete" class="menu-item danger" type="button"><span class="menu-icon">×</span>删除</button>
  </div>
  <div id="dialog-backdrop" class="dialog-backdrop" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <h2 id="dialog-title" class="dialog-title">重命名会话</h2>
        <button id="dialog-close" class="dialog-close" type="button" aria-label="关闭">×</button>
      </div>
      <p id="dialog-copy" class="dialog-copy">保持简短且易于识别</p>
      <input id="rename-input" maxlength="30" aria-label="会话名称">
      <div class="dialog-actions">
        <button id="dialog-cancel" type="button">取消</button>
        <button id="dialog-confirm" type="button">保存</button>
      </div>
    </section>
  </div>
  <aside id="reference-panel" class="reference-panel" hidden aria-label="查看法规原文">
    <div class="reference-toolbar">
      <span id="reference-title">法规原文</span>
      <span class="pager">
        <button id="page-prev" type="button" title="上一页">◀</button>
        <span id="page-indicator">第 - 页</span>
        <button id="page-next" type="button" title="下一页">▶</button>
      </span>
      <span><a id="reference-open-tab" href="#" target="_blank" rel="noopener">在新标签页打开</a><button id="reference-close" type="button">关闭</button></span>
    </div>
    <div class="reference-content"><img id="reference-frame" title="法规原文页" alt="法规原文页"></div>
  </aside>
  <div id="kb-view" class="kb-view" hidden>
    <div id="kb-list-view" class="kb-list-view">
      <div class="kb-header">
        <span class="kb-title">知识库（46 本规范）</span>
              </div>
      <div class="kb-tools">
        <label class="kb-select-all"><input type="checkbox" id="kb-select-all" checked> 全选</label>
        <input type="search" id="kb-search" placeholder="搜索规范名称或编号…">
        <span id="kb-selected-count" class="kb-selected-count"></span>
      </div>
      <div class="kb-tools">
        <button id="kb-categorize" type="button" class="kb-cate-btn">🗂 分类筛选</button>
        <label class="kb-select-all"><input type="checkbox" id="kb-select-all" checked> 全选</label>
        <input type="search" id="kb-search" placeholder="搜索规范名称或编号…">
        <span id="kb-selected-count" class="kb-selected-count"></span>
      </div>
      <div id="kb-list-body" class="kb-list-body"><div class="kb-status">加载中…</div></div>
    </div>

    <div id="kb-detail-view" class="kb-detail-view" hidden>
      <div class="kb-detail-toolbar">
        <button id="kb-back" type="button">&lt; 返回</button>
        <span id="kb-detail-title">知识库详情</span>
      </div>
      <div class="kb-detail-body">
        <div id="kb-detail-info" class="kb-detail-info"></div>
        <div class="kb-detail-preview-wrap">
          <div class="kb-pager">
            <button id="kb-page-prev" type="button" title="上一页">◀</button>
            <span id="kb-page-indicator">第 - 页</span>
            <button id="kb-page-next" type="button" title="下一页">▶</button>
          </div>
          <div class="kb-detail-preview">
            <div id="kb-preview-status" class="kb-status"></div>
            <img id="kb-preview-img" alt="PDF 页预览" hidden>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="kb-cate-modal" class="kb-cate-modal" hidden>
      <div class="kb-cate-card">
        <div class="kb-cate-title">选择知识库分类（可多选）</div>
        <div class="kb-cate-group"><div class="kb-cate-group-name">按专业</div><div id="kb-cate-major" class="kb-cate-chips"></div></div>
        <div class="kb-cate-group"><div class="kb-cate-group-name">按标准层级</div><div id="kb-cate-level" class="kb-cate-chips"></div></div>
        <div class="kb-cate-actions">
          <button id="kb-cate-all" type="button">全选</button><button id="kb-cate-clear" type="button">清空</button><button id="kb-cate-ok" type="button" class="primary">完成</button>
        </div>
      </div>
    </div>
  <script src="marked.min.js"></script>
  <script>
    let sessionId = null;
    const messages = document.querySelector('#messages');
    const question = document.querySelector('#question');
    const send = document.querySelector('#send');
    const sessionList = document.querySelector('#session-list');
    const conversationTitle = document.querySelector('#conversation-title');
    const sessionMenu = document.querySelector('#session-menu');
    const dialogBackdrop = document.querySelector('#dialog-backdrop');
    const dialogTitle = document.querySelector('#dialog-title');
    const dialogCopy = document.querySelector('#dialog-copy');
    const renameInput = document.querySelector('#rename-input');
    const dialogConfirm = document.querySelector('#dialog-confirm');
    const referencePanel = document.querySelector('#reference-panel');
    const referenceTitle = document.querySelector('#reference-title');
    let referenceFrame = document.querySelector('#reference-frame');
    const referenceOpenTab = document.querySelector('#reference-open-tab');
    const pagePrev = document.querySelector('#page-prev');
    const pageNext = document.querySelector('#page-next');
    const pageIndicator = document.querySelector('#page-indicator');
    let selectedSession = null;
    let dialogAction = null;

    // marked 对 null/undefined 会抛错，统一在此兜底并记录来源便于定位。
    function renderMarkdown(text) {
      if (text == null) {
        console.warn('[renderMarkdown] 收到空文本', new Error().stack);
        text = '';
      }
      return marked.parse(String(text), { breaks: true });
    }

    // 引用按钮区：每条引用一个胶囊按钮，点击后在右侧面板打开原始 PDF
    // 并通过 #page=N 定位到引用页（暂不画红框，bbox 数据先保留待后续使用）。
    function closeReferenceViewer() {
      referencePanel.hidden = true;
      document.body.classList.remove('ref-open');
      referenceFrame.removeAttribute('src');
    }

    // 翻页状态：当前浏览的法规与页码。
    let pagerState = { spec: '', page: 0, total: 0 };

    async function loadReferencePage(specNo, pagePdf, ref) {
      const params = new URLSearchParams({ spec_no: specNo, page_pdf: String(pagePdf) });
      if (ref && Array.isArray(ref.bbox) && ref.bbox.length === 4 && ref.page_pdf === pagePdf) {
        params.set('bbox', JSON.stringify(ref.bbox));
        if (ref.img_w) { params.set('img_w', String(ref.img_w)); params.set('img_h', String(ref.img_h)); }
      }
      const resp = await fetch(`/api/reference-image?${params.toString()}`);
      if (!resp.ok) throw new Error(`第${pagePdf}页加载失败`);
      const total = parseInt(resp.headers.get('X-Page-Count') || '0', 10);
      if (total) pagerState.total = total;
      pagerState.spec = specNo;
      pagerState.page = pagePdf;
      const blob = await resp.blob();
      const newImg = referenceFrame.cloneNode();
      newImg.src = URL.createObjectURL(blob);
      referenceFrame.replaceWith(newImg);
      referenceFrame = newImg;
      // 页码显示 + 翻页按钮可用性
      pageIndicator.textContent = `第 ${pagePdf} / ${pagerState.total || '?'} 页`;
      pagePrev.disabled = pagePdf <= 1;
      pageNext.disabled = pagerState.total ? pagePdf >= pagerState.total : false;
      referenceOpenTab.href = `/api/documents/${encodeURIComponent(specNo)}.pdf#page=${pagePdf}`;
    }

    function showReference(ref) {
      const specNo = ref.spec_no || ref.doc_name || '';
      if (!specNo || ref.page_pdf == null) return;
      referenceTitle.textContent = `${ref.spec_name || specNo} · ${ref.clause_no || ''}`;
      referencePanel.hidden = false;
      document.body.classList.add('ref-open');
      loadReferencePage(specNo, ref.page_pdf, ref).catch(err => {
        console.error(err);
        pageIndicator.textContent = '加载失败';
      });
    }

    pagePrev.addEventListener('click', () => {
      if (pagerState.page > 1) loadReferencePage(pagerState.spec, pagerState.page - 1).catch(console.error);
    });
    pageNext.addEventListener('click', () => {
      if (!pagerState.total || pagerState.page < pagerState.total) {
        loadReferencePage(pagerState.spec, pagerState.page + 1).catch(console.error);
      }
    });


    document.querySelector('#reference-close').addEventListener('click', closeReferenceViewer);

    // ── 底部引用列表：只显示段落标注未命中的条文（已出现的不再重复），
    //    样式与段落依据胶囊一致。
    function appendRefButtons(node, references, citedKeys) {
      if (!Array.isArray(references) || references.length === 0) return;
      // 显示规则（三选一）：
      // ① 段落标注已出现的 → 不重复（段落里已有胶囊）
      // ② leaf（下钻路过的叶子）且未命中 → 不显示（纯检索路径）
      // ③ page（读过原文的页）且未命中 → 底部补充显示
      const hasKey = citedKeys && typeof citedKeys.has === 'function'
        ? k => citedKeys.has(k) : () => false;   // 防御：citedKeys 必须是 Set
      const rest = references.filter(ref => {
        const key = (ref.spec_no || '') + (ref.clause_no || '');
        if (hasKey(key)) return false;
        return (ref.source || 'page') === 'page';
      });
      if (!rest.length) return;
      const box = document.createElement('div');
      box.className = 'refs';
      rest.forEach((ref, i) => {
        const a = document.createElement('a');
        a.className = 'cite-chip';
        a.textContent = (i === 0 ? '▸依据 ' : '') + `${ref.spec_no || ''} ${ref.clause_no || ''}`;
        a.addEventListener('click', () => showReference(ref));
        box.appendChild(a);
      })
      node.appendChild(box);
    }

    // JSON 回答中引用已经与段落显式绑定，不再从文本猜测归属。
    function appendParagraphReferences(node, references) {
      if (!Array.isArray(references) || !references.length) return;
      const span = document.createElement('span');
      span.className = 'para-cites';
      references.forEach((ref, index) => {
        const a = document.createElement('a');
        a.className = 'cite-chip';
        a.textContent = (index === 0 ? '▸依据 ' : '') + `${ref.spec_no || ''} ${ref.clause_no || ''}`;
        a.addEventListener('click', () => showReference(ref));
        span.appendChild(a);
      });
      node.appendChild(span);
    }

    function renderStructuredParagraphs(container, paragraphs) {
      container.replaceChildren();
      if (!Array.isArray(paragraphs) || !paragraphs.length) return;
      const list = document.createElement('ol');
      list.className = 'answer-paragraphs';
      paragraphs.forEach(paragraph => {
        const block = document.createElement('li');
        block.className = 'answer-paragraph';
        block.dataset.paragraphId = paragraph.id || '';
        block.innerHTML = renderMarkdown(paragraph.text || '');
        appendParagraphReferences(block, paragraph.references);
        list.appendChild(block);
      });
      container.appendChild(list);
    }

    // ── 段落级依据标注：扫描每段中的"规范号 + 条款号"，匹配引用后在
    //    段落末尾追加可点击的依据标签。
    function normSpec(s) { return (s || '').replace(/[\s（）()]/g, ''); }
    function ckey(c) { return (c || '').split('.').map(x => parseInt(x, 10) || 0); }
    function coversClause(range, clause) {
      if (range === clause || range.includes(clause)) return true;
      if (range.includes('~')) {
        const [a, b] = range.split('~');
        const ka = ckey(a), kc = ckey(clause), kb = ckey(b);
        return ka <= kc && kc <= kb;
      }
      return false;
    }
    const CITE_RE = /([A-Z]{2,}[0-9A-Za-z/]*\s*[-—–]?\s*\d{4}(?:\(\d{4}\))?)\s*(?:第|条款?)?\s*(\d+(?:\.\d+)+)/g;

    function annotateParagraphs(container, references) {
      if (!references || !references.length || !container) return null;
      let annotated = false;
      const citedKeys = new Set();
      container.querySelectorAll('p, li').forEach(block => {
        if (block.querySelector('.para-cites')) return;
        const text = block.textContent || '';
        const seen = new Set();
        const hits = [];
        let m;
        CITE_RE.lastIndex = 0;
        while ((m = CITE_RE.exec(text)) !== null) {
          const pspec = normSpec(m[1]), pclause = m[2];
          // 节级引用（两级条款号如 3.4、7.1）不标注——只有具体条文（三级+）才出依据
          if (pclause.split('.').length < 3) continue;
          references.forEach(ref => {
            const key = (ref.spec_no || '') + (ref.clause_no || '');
            if (seen.has(key)) return;
            const spec = normSpec(ref.spec_no);
            if (pspec && (pspec.includes(spec) || spec.includes(pspec))
                && coversClause(ref.clause_no || '', pclause)) {
              seen.add(key);
              citedKeys.add(key);
              hits.push(ref);
            }
          });
        }
        if (!hits.length) return;
        annotated = true;
        const span = document.createElement('span');
        span.className = 'para-cites';

        hits.forEach((ref, i) => {
          const a = document.createElement('a');
          a.className = 'cite-chip';
          a.textContent = (i === 0 ? '▸依据 ' : '') + `${ref.spec_no || ''} ${ref.clause_no || ''}`;
          a.addEventListener('click', () => showReference(ref));
          span.appendChild(a);
        });
        block.appendChild(span);
      });
      // 兜底：所有段落都没匹配上时，末尾追加完整依据标签，保证引用可见。
      if (!annotated) {
        const last = [...container.querySelectorAll('p, li')].pop();
        const span = document.createElement('span');
        span.className = 'para-cites';

        references.forEach(ref => {
          const a = document.createElement('a');
          a.className = 'cite-chip';
          a.textContent = `${ref.spec_no || ''} ${ref.clause_no || ''}`;
          citedKeys.add((ref.spec_no || '') + (ref.clause_no || ''));
          a.addEventListener('click', () => showReference(ref));
          span.appendChild(a);
        });
        (last || container).appendChild(span);
      }
      return citedKeys;
    }

    function appendMetaLine(node, meta) {
      const parts = [meta.cached ? '命中缓存' : '未命中缓存'];
      if (meta.tokens != null) parts.push(`token：${meta.tokens}`);
      parts.push(`${meta.elapsed}s`);
      const line = document.createElement('div');
      line.className = 'meta';
      line.textContent = parts.join('  ·  ');
      node.appendChild(line);
    }

    function addMessage(role, text, meta) {
      const empty = messages.querySelector('.empty');
      if (empty) empty.remove();
      const node = document.createElement('div');
      node.className = `message ${role}`;
      try {
        if (role !== 'assistant') {
          node.textContent = text;
        } else if (isJsonAnswer(text || '')) {
          // 兼容合并前远端保存的 t/c JSON 答案。
          renderJsonAnswer(node, text, meta ? meta.references : null);
        } else {
          const refs = Array.isArray(meta?.references) ? meta.references : [];
          const structured = meta?.answer_format === 'paragraphs-v1'
            || refs.some(ref => ref.paragraph_id);
          if (structured) {
            const paragraphs = (text || '').split(/\n\s*\n/).map((value, index) => ({
              id: `p${index + 1}`,
              number: index + 1,
              text: value,
              references: refs.filter(ref => ref.paragraph_id === `p${index + 1}`)
            }));
            renderStructuredParagraphs(node, paragraphs);
          } else {
            node.innerHTML = renderMarkdown(text || '');
            if (meta) {
              const citedKeys = annotateParagraphs(node, refs);
              appendRefButtons(node, refs, citedKeys);
            }
          }
        }
        if (meta) appendMetaLine(node, meta);
      } catch (err) {
        console.error('[addMessage渲染异常]', err);
        node.innerHTML = '';
        node.textContent = text || '';   // 保底：任何异常都显示原始文本，消息不消失
      }
      messages.appendChild(node);
      node.scrollIntoView({ block: 'end' });
      return node;
    }

    function resetMessages() {
      messages.replaceChildren();
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '输入问题开始对话';
      messages.appendChild(empty);
    }

    function renderSessions(sessions) {
      sessionList.replaceChildren();
      for (const session of sessions) {
        const row = document.createElement('div');
        row.className = `session-row${session.session_id === sessionId ? ' active' : ''}`;

        const openButton = document.createElement('button');
        openButton.className = 'session-open';
        openButton.textContent = session.title;
        openButton.title = session.title;
        openButton.addEventListener('click', () => selectSession(session.session_id, session.title));

        row.append(openButton);
        row.addEventListener('contextmenu', (event) => {
          event.preventDefault();
          showSessionMenu(event, session);
        });
        sessionList.appendChild(row);
      }
    }

    async function loadSessions() {
      const response = await fetch('/api/sessions');
      const sessions = await readResponse(response);
      if (!response.ok) throw new Error(sessions.detail || '读取会话失败');
      renderSessions(sessions);
      return sessions;
    }

    async function createSession() {
      const response = await fetch('/api/sessions', { method: 'POST' });
      const data = await readResponse(response);
      if (!response.ok) throw new Error(data.detail || '新建会话失败');
      sessionId = data.session_id;
      conversationTitle.textContent = data.title;
      resetMessages();
      await loadSessions();
    }

    function enterNewSession() {
      kbView.hidden = true;  // 新建会话 → 退出知识库视图
      // 只做界面跳转，不创建会话；发出第一个问题后才真正创建并录入左侧。
      sessionId = null;
      conversationTitle.textContent = '新会话';
      resetMessages();
      return loadSessions();
    }

    async function selectSession(id, title) {
      kbView.hidden = true;  // 点击左侧会话 → 退出知识库视图
      sessionId = id;
      conversationTitle.textContent = title;
      const response = await fetch(`/api/sessions/${encodeURIComponent(id)}/messages`);
      const history = await readResponse(response);
      if (!response.ok) throw new Error(history.detail || '读取对话失败');
      messages.replaceChildren();
      for (const message of history) {
        const meta = message.role === 'assistant' && message.elapsed != null
          ? { cached: !!message.cached, tokens: message.tokens, elapsed: message.elapsed,
              references: message.references, answer_format: message.answer_format }
          : undefined;
        addMessage(message.role, message.content, meta);
      }
      if (history.length === 0) resetMessages();
      await loadSessions();
    }

    function showSessionMenu(event, session) {
      selectedSession = session;
      const menuWidth = 156;
      const menuHeight = 82;
      const left = Math.min(event.clientX, window.innerWidth - menuWidth - 8);
      const top = Math.min(event.clientY, window.innerHeight - menuHeight - 8);
      sessionMenu.style.left = `${Math.max(8, left)}px`;
      sessionMenu.style.top = `${Math.max(8, top)}px`;
      sessionMenu.hidden = false;
    }

    function hideSessionMenu() {
      sessionMenu.hidden = true;
    }

    function showDialog(action, session) {
      selectedSession = session;
      dialogAction = action;
      const isRename = action === 'rename';
      dialogTitle.textContent = isRename ? '重命名会话' : '删除会话';
      dialogCopy.textContent = isRename ? '保持简短且易于识别' : `确定删除“${session.title}”及其全部对话吗？`;
      renameInput.hidden = !isRename;
      dialogConfirm.textContent = isRename ? '保存' : '删除';
      dialogConfirm.classList.toggle('danger', !isRename);
      if (isRename) renameInput.value = session.title;
      dialogBackdrop.hidden = false;
      if (isRename) {
        renameInput.focus();
        renameInput.select();
      } else {
        dialogConfirm.focus();
      }
    }

    function hideDialog() {
      dialogBackdrop.hidden = true;
      dialogAction = null;
    }

    async function renameSession(session, title) {
      const response = await fetch(`/api/sessions/${encodeURIComponent(session.session_id)}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });
      const data = await readResponse(response);
      if (!response.ok) throw new Error(data.detail || '修改名称失败');
      if (session.session_id === sessionId) conversationTitle.textContent = data.title;
      await loadSessions();
    }

    async function deleteSession(session) {
      if (send.disabled) return;
      const response = await fetch(`/api/sessions/${encodeURIComponent(session.session_id)}`, {
        method: 'DELETE'
      });
      const data = await readResponse(response);
      if (!response.ok) throw new Error(data.detail || '删除会话失败');

      const sessions = await loadSessions();
      if (session.session_id !== sessionId) return;
      if (sessions.length > 0) {
        await selectSession(sessions[0].session_id, sessions[0].title);
      } else {
        await enterNewSession();
      }
    }

    document.querySelector('#menu-rename').addEventListener('click', () => {
      hideSessionMenu();
      showDialog('rename', selectedSession);
    });

    document.querySelector('#menu-delete').addEventListener('click', () => {
      hideSessionMenu();
      showDialog('delete', selectedSession);
    });

    document.querySelector('#dialog-close').addEventListener('click', hideDialog);
    document.querySelector('#dialog-cancel').addEventListener('click', hideDialog);
    dialogBackdrop.addEventListener('click', (event) => {
      if (event.target === dialogBackdrop) hideDialog();
    });

    dialogConfirm.addEventListener('click', async () => {
      const session = selectedSession;
      if (!session || !dialogAction) return;
      try {
        if (dialogAction === 'rename') {
          const title = renameInput.value.trim();
          if (!title) return;
          await renameSession(session, title);
        } else {
          await deleteSession(session);
        }
        hideDialog();
      } catch (error) {
        dialogCopy.textContent = String(error.message);
      }
    });

    document.addEventListener('click', (event) => {
      if (!sessionMenu.hidden && !sessionMenu.contains(event.target)) hideSessionMenu();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        hideSessionMenu();
        hideDialog();
        closeReferenceViewer();
      }
      if (event.key === 'Enter' && !dialogBackdrop.hidden && dialogAction === 'rename') {
        dialogConfirm.click();
      }
    });

    function addWaitingMessage() {
      const empty = messages.querySelector('.empty');
      if (empty) empty.remove();
      const node = document.createElement('div');
      node.className = 'message waiting';
      const spinner = document.createElement('span');
      spinner.className = 'spinner';
      const label = document.createElement('span');
      label.textContent = '已运行 0 秒';
      node.append(spinner, label);
      messages.appendChild(node);
      node.scrollIntoView({ block: 'end' });

      const startedAt = Date.now();
      const timer = window.setInterval(() => {
        label.textContent = `已运行 ${Math.floor((Date.now() - startedAt) / 1000)} 秒`;
      }, 1000);
      return { node, timer };
    }

    document.querySelector('#new-session').addEventListener('click', async () => {
      try {
        await enterNewSession();
        question.focus();
      } catch (error) {
        addMessage('error', error.message);
      }
    });

    document.querySelector('#chat-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = question.value.trim();
      if (!text || send.disabled) return;
      if (!sessionId) await createSession();
      const requestSessionId = sessionId;
      if (conversationTitle.textContent === '新会话') {
        conversationTitle.textContent = text.slice(0, 30);
        const activeTitle = sessionList.querySelector('.session-row.active .session-open');
        if (activeTitle) activeTitle.textContent = conversationTitle.textContent;
      }
      addMessage('user', text);
      const waiting = addWaitingMessage();
      question.value = '';
      send.disabled = true;
      question.disabled = true;
      const appendAnswerMeta = (node, meta) => {
        const parts = [meta.cached ? '命中缓存' : '未命中缓存'];
        if (meta.tokens != null) parts.push(`token：${meta.tokens}`);
        parts.push(`${meta.elapsed}s`);
        const line = document.createElement('div');
        line.className = 'meta';
        line.textContent = parts.join('  ·  ');
        node.appendChild(line);
      };
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: requestSessionId, question: text, doc_ids: kbActiveDocIds() })
        });
        if (!response.ok || !response.body) {
          const data = await readResponse(response);
          throw new Error(data.detail || '请求失败');
        }
        if (requestSessionId !== sessionId) return;

        // 流式回答节点：上方"检索过程"折叠区 + 答案正文 + 底部统计行
        const node = document.createElement('div');
        node.className = 'message assistant';
        const steps = document.createElement('details');
        steps.className = 'steps';
        steps.open = true;
        steps.innerHTML = '<summary>检索过程</summary><ol></ol>';
        const stepList = steps.querySelector('ol');
        const body = document.createElement('div');
        let jsonBuf = null;            // segments 解析状态（所有 delta 统一喂入）
        let streamJsonRendered = 0;
        node.append(steps, body);
        messages.appendChild(node);
        node.scrollIntoView({ block: 'end' });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let answerText = '';
        const streamedParagraphs = [];
        let finalMeta = null;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const frames = buffer.split('\n\n');
          buffer = frames.pop();
          for (const frame of frames) {
            const line = frame.trim();
            if (!line.startsWith('data:')) continue;
            let event;
            try { event = JSON.parse(line.slice(5).trim()); } catch { continue; }
            if (event.type === 'step') {
              const li = document.createElement('li');
              li.textContent = event.text;
              stepList.appendChild(li);
              node.scrollIntoView({ block: 'end' });
            } else if (event.type === 'paragraph') {
              streamedParagraphs.push({ id: event.id, number: event.number,
                text: event.text, references: [] });
              renderStructuredParagraphs(body, streamedParagraphs);
              answerText = streamedParagraphs.map(item => item.text).join('\n\n');
              node.scrollIntoView({ block: 'end' });
            } else if (event.type === 'delta') {
              // 兼容未升级的后端流。
              answerText += event.text ?? '';
              if (!jsonBuf) jsonBuf = { s: '', depth: 0, inStr: false, esc: false, segs: [] };
              const segs = feedJsonSegments(event.text ?? '', jsonBuf);
              if (segs.length && streamJsonRendered === 0) body.replaceChildren();
              segs.slice(streamJsonRendered).forEach(seg => {
                seg._el = renderSegmentBlock(body, seg, null);
              });
              streamJsonRendered = segs.length;
              if (!segs.length && !/^\s*\{/.test(answerText)) {
                body.innerHTML = renderMarkdown(answerText);
              }
              node.scrollIntoView({ block: 'end' });
            } else if (event.type === 'done') {
              answerText = event.answer;
              if (Array.isArray(event.paragraphs)) {
                renderStructuredParagraphs(body, event.paragraphs);
              } else if (isJsonAnswer(answerText || '')) {
                renderJsonAnswer(body, answerText, event.references);
              } else {
                body.innerHTML = renderMarkdown(answerText || '');
                const citedKeys = annotateParagraphs(body, event.references);
                appendRefButtons(body, event.references, citedKeys);
              }
              finalMeta = event;
            } else if (event.type === 'error') {
              throw new Error(friendlyError(event.detail));
            }
          }
        }
        if (finalMeta) {
          appendAnswerMeta(node, finalMeta);
          conversationTitle.textContent = finalMeta.title;
          const activeTitle = sessionList.querySelector('.session-row.active .session-open');
          if (activeTitle) activeTitle.textContent = finalMeta.title;
        }
        steps.open = false;
        node.scrollIntoView({ block: 'end' });
        await loadSessions();
      } catch (error) {
        if (requestSessionId === sessionId) addMessage('error', friendlyError(String(error.message)));
      } finally {
        // 计时圈圈贯穿整个请求生命周期，任何结束路径（完成/出错/切会话）都消失。
        window.clearInterval(waiting.timer);
        waiting.node.remove();
        send.disabled = false;
        question.disabled = false;
        question.focus();
      }
    });

    question.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        document.querySelector('#chat-form').requestSubmit();
      }
    });

    async function initialize() {
      const sessions = await loadSessions();
      if (sessions.length === 0) {
        await enterNewSession();
      } else {
        await selectSession(sessions[0].session_id, sessions[0].title);
      }
      question.focus();
    }

    // ── JSON segments 流式解析与渲染（新格式：{"t":正文,"c":[条款号]}）
    // 深度计数 + 字符串状态机；segment 完整即回调渲染（假流式）。
    function isJsonAnswer(s) {
      // 宽容检测：容忍英文间隙前缀，内容中出现 JSON 对象特征即可
      return (s || '').includes('{"t":');
    }
    function feedJsonSegments(chunk, buf) {
      for (const ch of chunk) {
        buf.s += ch;
        if (buf.inStr) {
          if (buf.esc) buf.esc = false;
          else if (ch === '\\') buf.esc = true;
          else if (ch === '"') buf.inStr = false;
          continue;
        }
        if (ch === '"') buf.inStr = true;
        else if (ch === '{') {
          if (buf.depth === 0) buf.s = ch;  // 新对象开始：丢弃之前的非 JSON 前缀（如英文间隙文本）
          buf.depth++;
        }
        else if (ch === '}') {
          buf.depth--;
          if (buf.depth === 0) {
            try {
              const obj = JSON.parse(buf.s);
              if (obj && typeof obj.t === 'string') buf.segs.push(obj);
            } catch (err) { /* 非法对象丢弃 */ }
            buf.s = '';
          }
        }
      }
      return buf.segs;
    }
    function matchCitation(cite, refs) {
      if (!refs || !refs.length) return null;
      const norm = String(cite || '').replace(/[\s（）()]/g, '');
      return refs.find(r => {
        const rn = String(r.spec_no || '').replace(/[\s（）()]/g, '');
        if (!rn || !norm.startsWith(rn)) return false;
        const clause = norm.slice(rn.length);
        if (!clause) return false;
        if (coversClause(r.clause_no || '', clause)) return true;
        return String(r.clause_no || '').includes(clause);
      }) || null;
    }
    function renderSegmentBlock(body, seg, refs) {
      const div = document.createElement('div');
      div.className = 'seg-block';
      div.innerHTML = renderMarkdown(seg.t || '');
      body.appendChild(div);
      if (Array.isArray(seg.c) && seg.c.length) {
        const span = document.createElement('span');
        span.className = 'para-cites';
        const label = document.createElement('span');
        label.textContent = '▸依据 ';
        span.appendChild(label);
        let hits = 0;
        seg.c.forEach(cite => {
          const ref = matchCitation(cite, refs);
          const chip = document.createElement('a');
          chip.className = 'cite-chip';
          chip.textContent = ref ? `${ref.spec_no || ''} ${ref.clause_no || ''}` : cite;
          if (ref) { chip.addEventListener('click', () => showReference(ref)); hits++; }
          else chip.style.opacity = '.55';
          span.appendChild(chip);
        });
        if (hits) div.appendChild(span);
      }
      return div;
    }
    function renderJsonAnswer(body, raw, refs) {
      try {
        const buf = { s: '', depth: 0, inStr: false, esc: false, segs: [] };
        feedJsonSegments(raw, buf);
        body.innerHTML = '';
        buf.segs.forEach(seg => renderSegmentBlock(body, seg, refs));
        if (!buf.segs.length) body.innerHTML = renderMarkdown(raw);  // 容错：非 JSON 回退
        return buf;
      } catch (err) {
        console.error('[JSON渲染失败]', err);
        body.innerHTML = renderMarkdown(raw);  // 任何异常回退原文显示，回答不消失
        return null;
      }
    }

    // ── 知识库浏览：入口 → 列表 → 详情（左信息右预览，覆盖式）。
    const kbView = document.querySelector('#kb-view');
    const kbDetailView = document.querySelector('#kb-detail-view');
    const kbListBody = document.querySelector('#kb-list-body');
    // 知识库选择状态：取消勾选的 doc_id 存 localStorage（空=全选默认）。
    const KB_DESELECTED_KEY = 'kb_deselected';
    let kbAllIds = [];
    const kbDeselected = () => new Set(JSON.parse(localStorage.getItem(KB_DESELECTED_KEY) || '[]'));
    const kbSetDeselected = (set) => localStorage.setItem(KB_DESELECTED_KEY, JSON.stringify([...set]));
    const kbSearchKeyword = () => (document.querySelector('#kb-search').value || '').trim().toLowerCase();
    // ── 分类体系：规范号 → 专业分类（多属）；层级由 spec_type 推断。
    const KB_MAJOR = {
      '建筑通用': ['GB55031-2022','GB50352-2019','GB50096-2011','GB50180-2018','GB50345-2012','GB55030-2022','GB55019-2021','GB50763-2012','GB55016-2021','GBT50378-2019','GB55015-2021'],
      '办公': ['JGJT67-2019'],
      '文教': ['JGJT41-2014','JGJ38-2015','JGJ66-2015','GB50099-2011','JGJ39-2016'],
      '医疗': ['GB51039-2014','GB50333-2013'],
      '商业': ['JGJ48-2014','JGJ62-2014','JGJ58-2008'],
      '居住福利': ['JGJ36-2016','GB55025-2022','JGJ450-2018'],
      '交通物流': ['GB51236-2017','GB51157-2016','JGJ100-2015'],
      '体育': ['JGJ354-2014'],
      '防火': ['GB55037-2022','GB50016-2014(2018)','GB55036-2022','GB50222-2017','GB50067-2014','GB51298-2018','GB50098-2009'],
      '给水排水': ['GB55020-2021','GB50015-2019'],
      '暖通空调': ['GB50736-2012','GB50019-2015','GB51251-2017'],
      '电气': ['GB50052-2009','GB50053-2013','GBT50034-2024'],
      '人防': ['GB50038-2005(2023)'],
      '环境污染控制': ['GB50325-2020'],
    };
    const KB_LEVELS = ['强制性通用规范', '专门标准', '推荐性标准', '行业标准'];
    function kbLevelOf(item) {
      const no = item.spec_no || '', type = (item.spec_type || '').toUpperCase();
      if (type.includes('JGJ')) return '行业标准';
      if (no.includes('T') && no.startsWith('GB')) return '推荐性标准';
      if (/GB55/.test(no)) return '强制性通用规范';
      return '专门标准';
    }
    function kbMajorsOf(item) {
      const no = item.spec_no || '';
      const majors = [];
      for (const [major, nos] of Object.entries(KB_MAJOR)) {
        if (nos.some(n => no === n || no.startsWith(n.split('-')[0]))) majors.push(major);
      }
      return majors.length ? majors : ['建筑通用'];
    }
    // 用户已选分类（localStorage 持久；空 = 不按分类过滤）
    const KB_CATE_KEY = 'kb_categories';
    function showCateError(msg) {
      const title = document.querySelector('.kb-cate-title');
      const card = document.querySelector('.kb-cate-card');
      title.textContent = msg;
      title.style.color = '#d93025';
      card.style.borderColor = '#d93025';
      setTimeout(() => {
        title.textContent = '选择知识库分类（可多选）';
        title.style.color = '';
        card.style.borderColor = '';
      }, 2000);
    }
    const kbCates = () => new Set(JSON.parse(localStorage.getItem(KB_CATE_KEY) || '[]'));
    const kbSetCates = (set) => localStorage.setItem(KB_CATE_KEY, JSON.stringify([...set]));

    document.querySelector('#kb-entry').addEventListener('click', openKnowledgeBase);
    document.querySelector('#kb-back').addEventListener('click', () => { kbDetailView.hidden = true; });

    async function openKnowledgeBase() {
      kbView.hidden = false;
      kbDetailView.hidden = true;
      kbListBody.innerHTML = '<div class="kb-status">加载中…</div>';
      try {
        const resp = await fetch('/api/knowledge-base');
        if (!resp.ok) throw new Error('加载失败');
        const items = await resp.json();
        if (!items.length) { kbListBody.innerHTML = '<div class="kb-status">知识库为空</div>'; return; }
        kbAllIds = items.map(item => item.doc_id);
        const deselectedNow = kbDeselected();
        // 排序：选中的排前面，未选中的排后面（组内按名称）
        items.sort((a, b) => {
          const aSel = !deselectedNow.has((a.spec_no || '') + a.doc_id);
          const bSel = !deselectedNow.has((b.spec_no || '') + b.doc_id);
          if (aSel !== bSel) return aSel ? -1 : 1;
          return (a.name || '').localeCompare(b.name || '');
        });
        kbListBody.innerHTML = '';
        items.forEach(item => {
          item._majors = kbMajorsOf(item);
          item._level = kbLevelOf(item);
          const card = document.createElement('div');
          card.className = 'kb-card';
          const box = document.createElement('input');
          box.type = 'checkbox';
          box.checked = !kbDeselected().has((item.spec_no || '') + item.doc_id);
          box.addEventListener('click', e => e.stopPropagation());
          const specKey = (item.spec_no || '') + item.doc_id;
          box.dataset.spec = specKey;
          box.addEventListener('change', () => {
            const deselected = kbDeselected();
            if (box.checked) deselected.delete(specKey);
            else deselected.add(specKey);
            kbSetDeselected(deselected);
            updateKbSelectedCount();
            resortKbList();
          });
          const bodyDiv = document.createElement('div');
          bodyDiv.className = 'kb-card-body';
          const name = document.createElement('div');
          name.className = 'kb-card-name';
          name.textContent = item.name || '';
          const sub = document.createElement('div');
          sub.className = 'kb-card-sub';
          sub.textContent = item.spec_name || '';
          const meta = document.createElement('div');
          meta.className = 'kb-card-meta';
          meta.textContent = item.has_pdf ? (item.page_count + ' 页 · PDF 可预览') : '无 PDF 预览';
          bodyDiv.append(name, sub, meta);
          card.append(box, bodyDiv);
          card.dataset.searchable = ((item.name || '') + ' ' + (item.spec_name || '')).toLowerCase();
          card.dataset.majors = item._majors.join('|');
          card.dataset.level = item._level;
          card.dataset.spec = (item.spec_no || '') + item.doc_id;
          card.addEventListener('click', () => openKbDetail(item));
          kbListBody.appendChild(card);
        });
        updateKbSelectedCount();
      } catch (err) {
        kbListBody.innerHTML = '';
        const status = document.createElement('div');
        status.className = 'kb-status';
        status.textContent = '加载失败：' + err.message;
        const retry = document.createElement('button');
        retry.textContent = '重试';
        retry.addEventListener('click', openKnowledgeBase);
        status.appendChild(document.createElement('br'));
        status.appendChild(retry);
        kbListBody.appendChild(status);
      }
    }

    // 勾选变化后重排：选中的卡片移动到前面（组内保持原序）。
    function resortKbList() {
      const deselected = kbDeselected();
      const cards = [...kbListBody.querySelectorAll('.kb-card')];
      cards.sort((a, b) => {
        const aSel = !deselected.has(a.dataset.spec || '');
        const bSel = !deselected.has(b.dataset.spec || '');
        if (aSel !== bSel) return aSel ? -1 : 1;
        return 0;
      });
      cards.forEach(c => kbListBody.appendChild(c));
    }

    function updateKbSelectedCount() {
      const el = document.querySelector('#kb-selected-count');
      if (el) el.textContent = `已选 ${kbAllIds.length - kbDeselected().size} / ${kbAllIds.length} 本`;
    }

    document.querySelector('#kb-select-all').addEventListener('change', e => {
      // 全选只作用于分类过滤后【显示中】的卡片；隐藏（未选分类）的保持原状。
      const checked = e.target.checked;
      const deselected = kbDeselected();
      document.querySelectorAll('#kb-list-body .kb-card').forEach(card => {
        if (card.style.display === 'none') return;
        const box = card.querySelector('input[type=checkbox]');
        if (!box) return;
        box.checked = checked;
        const key = box.dataset.spec || '';
        if (checked) deselected.delete(key);
        else deselected.add(key);
      });
      kbSetDeselected(deselected);
      updateKbSelectedCount();
      resortKbList();
    });
    document.querySelector('#kb-search').addEventListener('input', e => {
      const kw = e.target.value.trim().toLowerCase();
      kbListBody.querySelectorAll('.kb-card').forEach(card => {
        card.style.display = (card.dataset.searchable || '').includes(kw) ? '' : 'none';
      });
    });

    function kbActiveDocIds() {
      // 全选（无取消勾选）→ null（不限定，性能最优）；否则返回选中 id 数组。
      const deselected = kbDeselected();
      if (!deselected.size) return null;
      const ids = kbAllIds.filter(id => !deselected.has(id));
      return ids.length ? ids : null;
    }

    // 分类确定 → 勾选联动：选中分类的规范勾上，其余取消勾选。
    function applyCategorySelection() {
      const cates = kbCates();
      if (!cates.size) return;
      const deselected = kbDeselected();
      document.querySelectorAll('#kb-list-body .kb-card').forEach(card => {
        const box = card.querySelector('input[type=checkbox]');
        if (!box) return;
        const major = card.dataset.majors || '';
        const level = card.dataset.level || '';
        const inCate = major.split('|').some(x => cates.has(x)) || cates.has(level);
        box.checked = inCate;
        const key = (box.dataset.spec || '');
        if (inCate) deselected.delete(key);
        else deselected.add(key);
      });
      kbSetDeselected(deselected);
      updateKbSelectedCount();
      resortKbList();
    }

    function openCateModal() {
      const modal = document.querySelector('#kb-cate-modal');
      const majorBox = document.querySelector('#kb-cate-major');
      const levelBox = document.querySelector('#kb-cate-level');
      const saved = kbCates();
      majorBox.innerHTML = '';
      levelBox.innerHTML = '';
      const toggleChip = chip => {
        chip.classList.toggle('on');
        const on = [...document.querySelectorAll('#kb-cate-modal .kb-cate-chip.on')];
        kbSetCates(new Set(on.map(c => c.dataset.cate)));
        applyCategorySelection();  // 点击即生效：勾选状态实时联动
      };
      Object.keys(KB_MAJOR).forEach(major => {
        const chip = document.createElement('span');
        chip.className = 'kb-cate-chip' + (saved.has(major) ? ' on' : '');
        chip.textContent = major;
        chip.dataset.cate = major;
        chip.addEventListener('click', () => toggleChip(chip));
        majorBox.appendChild(chip);
      });
      KB_LEVELS.forEach(level => {
        const chip = document.createElement('span');
        chip.className = 'kb-cate-chip' + (saved.has(level) ? ' on' : '');
        chip.textContent = level;
        chip.dataset.cate = level;
        chip.addEventListener('click', () => toggleChip(chip));
        levelBox.appendChild(chip);
      });
      modal.hidden = false;
    }

    document.querySelector('#kb-categorize').addEventListener('click', openCateModal);
    document.querySelector('#kb-cate-ok').addEventListener('click', () => {
      // 校验：列表已加载时至少勾选一本规范（0 勾选 = 检索无范围）
      const boxes = [...document.querySelectorAll('#kb-list-body input[type=checkbox]')];
      const listLoaded = boxes.length > 0;
      if (listLoaded && !boxes.some(b => b.checked)) {
        showCateError('应至少选择一项');
        return;  // 阻止关闭
      }
      document.querySelector('#kb-cate-modal').hidden = true;  // 选择已实时生效，仅关闭弹窗
    });
    // 弹窗内全选：所有分类 chips 选中 → 全部规范勾选
    document.querySelector('#kb-cate-all').addEventListener('click', () => {
      document.querySelectorAll('#kb-cate-modal .kb-cate-chip').forEach(c => c.classList.add('on'));
      kbSetCates(new Set([...document.querySelectorAll('#kb-cate-modal .kb-cate-chip')].map(c => c.dataset.cate)));
      applyCategorySelection();  // 全部勾选
    });
    // 弹窗内清空：分类清空 → 恢复全部勾选（不按分类过滤）
    document.querySelector('#kb-cate-clear').addEventListener('click', () => {
      document.querySelectorAll('#kb-cate-modal .kb-cate-chip').forEach(c => c.classList.remove('on'));
      kbSetCates(new Set());
      localStorage.setItem(KB_DESELECTED_KEY, '[]');  // 清空取消勾选集合 = 全选
      document.querySelectorAll('#kb-list-body input[type=checkbox]').forEach(box => { box.checked = true; });
      updateKbSelectedCount();
    });

    async function openKbDetail(item) {
      kbDetailView.hidden = false;
      document.querySelector('#kb-detail-title').textContent =
        (item.name || '') + ' ' + (item.spec_name || '');
      const info = document.querySelector('#kb-detail-info');
      const rows = [['规范编号', item.spec_no], ['规范名称', item.spec_name],
                    ['状态', item.status], ['实施日期', item.implement_date],
                    ['页数', item.page_count]];
      info.innerHTML = rows.map(([k, v]) =>
        '<div class="kb-info-row"><span>' + k + '</span>' + (v || '—') + '</div>').join('')
        + '<div class="kb-info-desc">' + (item.description || '暂无简介') + '</div>';
      if (!item.has_pdf) {
        kbPager = { docId: '', page: 0, total: 0 };
        const img = document.querySelector('#kb-preview-img');
        const status = document.querySelector('#kb-preview-status');
        img.hidden = true;
        status.hidden = false;
        status.textContent = '该知识库无 PDF 可预览';
        document.querySelector('#kb-page-indicator').textContent = '无预览';
        document.querySelector('#kb-page-prev').disabled = true;
        document.querySelector('#kb-page-next').disabled = true;
        return;
      }
      await loadKbPage(item.doc_id, 1);
    }

    let kbPager = { docId: '', page: 0, total: 0 };

    async function loadKbPage(docId, page) {
      const img = document.querySelector('#kb-preview-img');
      const status = document.querySelector('#kb-preview-status');
      status.hidden = false;
      status.textContent = '预览加载中…';
      try {
        const resp = await fetch('/api/knowledge-base/' + docId + '/first-page?page=' + page);
        if (!resp.ok) throw new Error('预览加载失败');
        const total = parseInt(resp.headers.get('X-Page-Count') || '0', 10);
        kbPager = { docId, page, total: total || kbPager.total };
        const blob = await resp.blob();
        img.src = URL.createObjectURL(blob);
        img.hidden = false;
        status.hidden = true;
        document.querySelector('#kb-page-indicator').textContent = '第 ' + page + ' / ' + (total || '?') + ' 页';
        document.querySelector('#kb-page-prev').disabled = page <= 1;
        document.querySelector('#kb-page-next').disabled = total ? page >= total : false;
      } catch (err) {
        status.textContent = '预览加载失败';
      }
    }

    document.querySelector('#kb-page-prev').addEventListener('click', () => {
      if (kbPager.page > 1) loadKbPage(kbPager.docId, kbPager.page - 1);
    });
    document.querySelector('#kb-page-next').addEventListener('click', () => {
      if (!kbPager.total || kbPager.page < kbPager.total) loadKbPage(kbPager.docId, kbPager.page + 1);
    });

    initialize().catch((error) => addMessage('error', error.message));

    // 页面加载完成 → 自动弹知识库分类选择
    openCateModal();

    // 把后端报错翻译成用户能看懂的话（匹配不到就原样显示）。
    // 只认 "Insufficient Balance/余额不足" 文字特征（高度特异，不会误判）；
    // 402 状态码数字太弱（截断的无关报错可能带它），不作为判据。
    function friendlyError(detail) {
      const text = String(detail || '');
      if (/insufficient balance|余额不足/i.test(text)) {
        return 'token余额不足，请前往 DeepSeek 平台充值后重试';
      }
      if (/503|service[_ ]unavailable|Service is too busy|too busy/i.test(text)) {
        return 'LLM 服务器繁忙，请稍后再试';
      }
      if (/timeout|timed out/i.test(text)) {
        return 'LLM 请求超时，请稍后再试';
      }
      if (/rate limit|429/i.test(text)) {
        return 'LLM 请求频率超限，请稍后再试';
      }
      return text;
    }

    async function readResponse(response) {
      const text = await response.text();
      try {
        return text ? JSON.parse(text) : {};
      } catch {
        return { detail: text || `请求失败（${response.status}）` };
      }
    }
  </script>
